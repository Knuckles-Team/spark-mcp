[bumpversion]
current_version = 0.4.3
commit = True
tag = True

[bumpversion:file:pyproject.toml]
search = version = "{current_version}"
replace = version = "{new_version}"

[bumpversion:file(docker-img):docker/Dockerfile]
search = spark-mcp[mcp]=={current_version}
replace = spark-mcp[mcp]=={new_version}

[bumpversion:file:README.md]
search = Version: {current_version}
replace = Version: {new_version}

[bumpversion:file(init):spark_mcp/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file(server):spark_mcp/mcp_server.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file(client):spark_mcp/api_client.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"
