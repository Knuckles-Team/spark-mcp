[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "spark-mcp"
version = "0.4.1"
description = "Spark Connect (gRPC) API + MCP Server for Agentic AI!"
readme = "README.md"
classifiers = [ "Development Status :: 3 - Alpha", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "agent-connector-sdk[mcp]>=0.3.6,<1.0.0", "httpx>=0.28.1", "numpy>=2.5.4", "pandas>=3.0.6", "pyarrow>=26.0.0", "pyspark-client>=4.1.3,<4.2.0", "requests>=2.34.2",]
[[project.authors]]
name = "Project Maintainers"
email = "maintainers@users.noreply.github.com"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "agent-connector-sdk[mcp]>=0.3.6,<1.0.0",]
all = [ "agent-connector-sdk[mcp]>=0.3.6,<1.0.0",]
test = [ "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",]

[project.scripts]
spark-mcp = "spark_mcp.mcp_server:mcp_server"

[project.entry-points."agent_connector_sdk.skill_providers"]
spark-mcp = "spark_mcp.skills"

[project.entry-points."agent_connector_sdk.ontology_providers"]
spark-mcp = "spark_mcp.ontology"

[project.entry-points."agent_connector_sdk.source_connector_providers"]
spark-mcp = "spark_mcp.connectors"

[tool.pipelines]
# pyspark-client (the thin Spark Connect client) publishes only a pure-Python
# source distribution; the release readiness gate and the Dockerfile build that
# one package from source, and nothing else.
allow-source-build = ["pyspark-client"]

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [ "pytest-timeout>=2.4.0",]

[tool.setuptools.package-data]
spark_mcp = [ "mcp_config.json", "agent_data/**", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
